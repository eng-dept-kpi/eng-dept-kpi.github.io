<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>منصة مؤشرات الأداء - الدائرة الهندسية</title>
  <meta name="theme-color" content="#0b3b33">
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Almarai:wght@300;400;700;800&display=swap" rel="stylesheet">
  <style>
:root{
  --white:#fff; --soft:#f6f4ee; --ink:#1a2320; --muted:#5a635e; --faint:#656d67; --line:#ddd9ce; --hair:#ece9e1;
  --pri:#0e4a40; --pri-2:#0a352e; --brass:#a98a45;
  --on:#14704f; --on-soft:#e5f1eb; --on-zone:#d9ebe2; --risk:#8a5a06; --risk-fill:#c08a1e; --risk-soft:#f9f0dc; --risk-zone:#f5e7c7;
  --bad:#a02d24; --bad-soft:#f8e7e4; --bad-zone:#f3dcd8; --none:#566270; --none-soft:#edeef0;
  /* Categorical order validated with the dataviz palette script (light surface). */
  --c-finished:#00907e; --c-transferred:#3a6fd8; --c-stuck:#b8559a; --c-progress:#a08a3c;
  --page:1600px; --pad:clamp(16px,3vw,48px);
}
*{box-sizing:border-box}
html{font-size:clamp(16px,.2vw + 13.3px,18px)}
html,body{margin:0;background:var(--white);color:var(--ink);font-family:"Almarai",Tahoma,Arial,sans-serif;line-height:1.6}
button,select{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:3px solid #8a6a1f;outline-offset:2px}
.lead :focus-visible,.strip :focus-visible,footer :focus-visible{outline-color:#c28e1c}
.loading{padding:60px;text-align:center;color:var(--muted)}
.tn{font-variant-numeric:tabular-nums}
.ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}
.wrap{max-width:var(--page);margin-inline:auto;padding-inline:var(--pad);width:100%}
.page{min-height:100vh;display:flex;flex-direction:column}
main{flex:1}

/* Official header */
.strip{background:var(--pri-2);color:#e3ebe7;font-size:.8rem;border-bottom:2px solid var(--brass)}
.strip .wrap{display:flex;justify-content:space-between;gap:1rem;padding-block:.22rem;flex-wrap:wrap}
.mast{background:var(--white);border-bottom:1px solid var(--line)}
.mast .wrap{display:flex;align-items:center;gap:2.2rem;min-height:4.6rem;flex-wrap:wrap}
.org{display:flex;align-items:center;gap:.85rem;text-decoration:none;padding-block:.45rem}
.org img{height:3.7rem;width:auto;display:block}
.org b{display:block;font-size:1.25rem;font-weight:800;line-height:1.2;color:var(--pri-2)}
.org span{font-size:.86rem;color:var(--muted)}
.nav{display:flex;gap:.2rem;align-self:stretch}
.nav a{display:flex;align-items:center;padding:0 .95rem;text-decoration:none;font-weight:400;color:var(--ink);border-bottom:3px solid transparent;border-top:3px solid transparent;min-height:44px}
.nav a:hover{color:var(--pri)}
.nav a.on{color:var(--pri);border-bottom-color:var(--brass);font-weight:700}
.tools{margin-inline-start:auto;display:flex;align-items:center;gap:.6rem;flex-wrap:wrap}
.tools select{min-height:44px;border:1px solid var(--line);border-radius:2px;padding:0 .6rem;background:var(--white);cursor:pointer;min-width:12.5rem}
.btn{min-height:44px;border-radius:2px;border:1px solid var(--pri);background:var(--pri);color:#fff;padding:0 1rem;cursor:pointer;display:inline-flex;align-items:center;gap:.4rem;font-weight:700;transition:background .15s;text-decoration:none}
.btn:hover{background:var(--pri-2)}
.btn.ghost{background:transparent;color:var(--pri)}
.btn.ghost:hover{background:var(--soft)}
.btn[disabled]{opacity:.6;cursor:not-allowed}

/* Page title */
.head{padding-block:.8rem .7rem}
.crumb{font-size:.84rem;color:var(--muted);margin-bottom:.15rem}
.crumb a{color:var(--pri)}
.head h1{font-size:2.05rem;font-weight:800;line-height:1.25;margin:0;color:var(--pri-2)}
.lede{margin:.3rem 0 0;font-size:1.02rem;color:var(--muted);max-width:90ch}
.lede b{color:var(--ink);font-weight:700}

/* Dark title band on screen; the PDF stays light to save ink. */
.lead{background:linear-gradient(180deg,var(--pri-2),#08302a);color:#fff}
.lead h1{color:#fff}
.lead .lede{color:#cfdcd7}.lead .lede b{color:#fff}
.lead .crumb{color:#cfdcd7}.lead .crumb a{color:#e8dcbc}
.lead .figs{background:rgba(255,255,255,.05);border-block:1px solid rgba(255,255,255,.14);border-bottom:2px solid var(--brass)}
.lead .fig{border-color:rgba(255,255,255,.14)}
.lead .fig .k,.lead .fig .s,.lead .fig .v small{color:#cfdcd7}
.lead .fig .v{color:#fff}
.lead .btn.ghost{border-color:rgba(255,255,255,.55);color:#fff;background:transparent}

/* Key figures */
.figs{background:var(--soft);border-block:1px solid var(--line)}
.figs .wrap{display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.fig{padding:.55rem 1.4rem;border-inline-start:1px solid var(--line);min-width:0}
.fig:first-child{border-inline-start:0;padding-inline-start:0}
.fig .k{font-size:.86rem;color:var(--muted);font-weight:400}
.fig .v{font-size:2.5rem;font-weight:800;line-height:1.2;color:var(--pri-2)}
.fig .v small{font-size:1.15rem;font-weight:400;color:var(--muted)}
.fig .s{font-size:.86rem;color:var(--muted);min-height:1.5em}

/* Sections */
.cols{display:grid;grid-template-columns:minmax(0,1.85fr) minmax(0,1fr);gap:3rem;padding-block:.9rem 1.1rem}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:.8rem;flex-wrap:wrap;border-bottom:1px solid var(--pri);padding-bottom:.3rem;margin-bottom:.1rem}
h2{font-size:1.1rem;font-weight:800;margin:0;color:var(--pri-2)}
.note{font-size:.84rem;color:var(--muted)}
.block{margin-bottom:1.15rem}
.block:last-child{margin-bottom:0}
.narrow-block{padding-block:1rem}

.pill{display:inline-flex;align-items:center;gap:.28rem;border-radius:2px;padding:.06rem .5rem;font-size:.82rem;font-weight:700;white-space:nowrap;justify-self:start}
.s-on_track{background:var(--on-soft);color:var(--on)} .s-at_risk{background:var(--risk-soft);color:var(--risk)}
.s-behind{background:var(--bad-soft);color:var(--bad)} .s-none{background:var(--none-soft);color:var(--none)}

/* Unit ranking */
.u-grid{display:grid;grid-template-columns:minmax(10rem,1.15fr) minmax(8rem,2fr) 4.2rem 4.2rem 8rem 1rem;gap:1.1rem;align-items:center}
.u-grid.has-delta{grid-template-columns:minmax(10rem,1.15fr) minmax(8rem,2fr) 4.2rem 4.2rem 3.6rem 8rem 1rem}
.u-head{font-size:.8rem;color:var(--faint);padding-block:.4rem;border-bottom:1px solid var(--line)}
a.u-row{min-height:2.75rem;border-bottom:1px solid var(--hair);text-decoration:none;color:inherit;transition:background .15s}
a.u-row:hover{background:var(--soft)}
.u-name{font-weight:700;line-height:1.3}
.u-name small{display:block;font-weight:400;font-size:.8rem;color:var(--muted)}
.track{position:relative;height:.7rem;background:var(--hair)}
.fill{position:absolute;inset-block:0;right:0;animation:grow .45s ease-out both;transform-origin:right}
.scale{position:relative;display:block;height:1.2em;direction:ltr}
.scale i{position:absolute;font-style:normal;transform:translateX(50%);font-variant-numeric:tabular-nums}
.key{display:flex;flex-wrap:wrap;gap:.45rem 1.5rem;padding-top:.65rem;font-size:.82rem;color:var(--muted)}
.key>span{display:inline-flex;align-items:center;gap:.4rem}
.formula{font-size:.82rem;color:var(--muted);padding-top:.35rem}
.formula b{color:var(--ink);font-weight:700}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.tick{position:absolute;inset-block:0;width:1px;background:#fff}
.track.empty{background:repeating-linear-gradient(135deg,var(--hair),var(--hair) 4px,#fff 4px,#fff 8px)}
.u-val{font-weight:800;font-size:1.1rem;text-align:left}
.u-rec{font-size:.88rem;color:var(--muted);text-align:left}
.delta{font-size:.86rem;font-weight:700;display:inline-flex;align-items:center;gap:.12rem;color:var(--muted)}
.delta.up{color:var(--on)} .delta.down{color:var(--bad)}
.chev{color:var(--faint);display:flex}

/* Side lists */
.seg{display:flex;gap:2px;height:.6rem;margin:.55rem 0 .35rem}
.seg>div{min-width:3px}
.row3{display:grid;grid-template-columns:minmax(0,1fr) 3.6rem 2.8rem;gap:.5rem;align-items:center;min-height:1.6rem;font-size:.92rem;border-bottom:1px solid var(--hair)}
.row3:last-child{border-bottom:0}
.row3 .dot{width:.58rem;height:.58rem;display:inline-block;margin-inline-end:.45rem}
.row3 b{font-weight:700;text-align:left}
.row3 .tn{text-align:left;color:var(--muted);font-size:.84rem}
.work-sum{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.6rem;padding-top:.5rem}
.work-sum .v{font-size:1.25rem;font-weight:800;color:var(--pri-2);line-height:1.2}
.work-sum .k{font-size:.8rem;color:var(--muted)}

/* Editing figures */
input.num{width:5.6rem;min-height:44px;border:1px solid var(--line);border-radius:2px;padding:0 .4rem;font:inherit;text-align:left;direction:ltr;background:var(--white)}
.txt{min-height:44px;border:1px solid var(--line);border-radius:2px;padding:0 .5rem;font:inherit;background:var(--white);width:9rem}
.txt.wide{width:100%;min-width:14rem}
.txt.short{width:5rem}
.txt:focus{outline:2px solid #8a6a1f;outline-offset:1px;border-color:var(--pri)}
.ferr{color:var(--bad);font-size:.88rem;font-weight:700}
.form-actions{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center;padding-block:.9rem}
.form-actions .sep{margin-inline-start:auto}
.cover.under{color:var(--risk)}.cover.over{color:var(--bad);font-weight:700}.cover.full{color:var(--on)}
.reason-notes{margin-top:.5rem;font-size:.9rem;color:var(--muted)}.reason-notes p{margin:.25rem 0}.reason-notes b{color:var(--ink)}
.rowsum{display:block;font-size:.82rem;margin-top:.25rem}.rowsum.ok{color:var(--on)}.rowsum.off{color:var(--risk);font-weight:700}
.row3.unclassified span:first-child{color:var(--muted);font-style:italic}
.period-line{margin-top:.1rem;font-weight:700;color:#e8dcbc}
.card.saved{margin-top:1rem}
details.add-unit summary{list-style:none;display:inline-flex;cursor:pointer}details.add-unit summary::-webkit-details-marker{display:none}details.add-unit[open] summary{margin-bottom:.8rem}
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.4rem;margin:1.2rem 0 .4rem;border-bottom:2px solid var(--line)}
.step-tab{display:flex;align-items:center;gap:.5rem;min-height:48px;padding:.4rem .6rem;background:none;border:0;border-bottom:3px solid transparent;margin-bottom:-2px;font:inherit;font-weight:700;color:var(--muted);cursor:pointer;text-align:right}
.step-tab .num{display:inline-flex;align-items:center;justify-content:center;min-width:1.7rem;height:1.7rem;border-radius:50%;background:var(--soft);border:1px solid var(--line);color:var(--ink);font-size:.9rem}
.step-tab.on{color:var(--pri-2);border-bottom-color:var(--brass)}.step-tab.on .num{background:var(--pri);border-color:var(--pri);color:#fff}
.glossary{margin:.2rem 0 .8rem;border:1px solid var(--line);background:var(--soft);padding:.5rem .9rem}
.glossary summary{cursor:pointer;font-weight:700;color:var(--pri);min-height:36px;display:flex;align-items:center}
.glossary dl{margin:.3rem 0 .2rem;display:grid;gap:.25rem}.glossary dl div{display:flex;gap:.5rem}.glossary dt{font-weight:700;min-width:6.5rem}.glossary dd{margin:0;color:var(--muted)}
@media (max-width:640px){.step-tab{flex-direction:column;gap:.15rem;font-size:.85rem;text-align:center}.glossary dl div{flex-direction:column;gap:0}}
.rg{padding:.55rem 0;border-bottom:1px solid var(--hair)}
.rg-head{display:grid;grid-template-columns:minmax(0,1fr) auto 3.2rem;gap:.6rem;align-items:baseline}
.rg-name{font-weight:700}.rg-pct{color:var(--muted);text-align:left}
.rg-bar{height:6px;background:var(--hair);margin-top:.35rem}.rg-bar i{display:block;height:100%;background:var(--pri)}
.rg-management .rg-bar i{background:var(--risk-fill)}.rg-none .rg-bar i{background:var(--none)}.rg-normal .rg-bar i{background:var(--on)}
.rg-none .rg-name{color:var(--muted);font-weight:400}
.rg-items{font-size:.86rem;color:var(--muted);margin-top:.3rem}
.mg-box{margin-top:1rem;border:1px solid var(--line);border-top:3px solid var(--brass);background:var(--soft);padding:.7rem 1rem}
.mg-box h3{margin:0 0 .4rem;font-size:1.02rem;color:var(--pri-2)}.mg-box ul{margin:0;padding-inline-start:1.1rem}.mg-box li{margin:.3rem 0}
.mg-note{display:block;font-size:.86rem;color:var(--muted)}
.work-sum.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.money-h{font-size:.95rem;margin:.9rem 0 .2rem;color:var(--pri-2)}
.row3.money{grid-template-columns:minmax(0,1fr) auto}
.just-box ul{margin:.5rem 0 0;padding-inline-start:1.3rem;line-height:1.9;font-size:1.02rem}.just-box li{margin:.25rem 0}
.just-box p{margin:.6rem 0 0;line-height:1.9;font-size:1.02rem}
.fld textarea{border:1px solid var(--line);border-radius:2px;padding:.6rem .7rem;font:inherit;background:var(--white);width:100%;line-height:1.8;resize:vertical}
.fld textarea:focus{outline:2px solid #8a6a1f;outline-offset:1px;border-color:var(--pri)}
a.row3.money{grid-template-columns:minmax(0,1fr) auto auto;text-decoration:none;color:inherit;align-items:center}
a.row3.money:hover{background:var(--soft)}
a.wlink{text-decoration:none;color:inherit;display:block}a.wlink:hover .v{text-decoration:underline}
.dist{padding:.5rem 0;border-bottom:1px solid var(--hair)}
.dist-head{display:grid;grid-template-columns:minmax(0,1fr) auto 3rem;gap:.6rem;align-items:baseline}
.dist-name{font-weight:700}.dist-pct{color:var(--muted);text-align:left}
.task-box{margin-top:1.2rem;border:1px solid var(--line);border-top:3px solid var(--brass);background:var(--white)}
.task{display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap;padding:.8rem 1.1rem}
.task+.task{border-top:1px solid var(--hair)}
.task b{display:block;color:var(--pri-2);font-size:1.05rem}
.auth{max-width:34rem;padding-block:2.2rem 3rem;display:grid;gap:1.2rem}
.card{background:var(--white);border:1px solid var(--line);border-top:3px solid var(--brass);padding:1.4rem 1.5rem}
.card h1{font-size:1.6rem;font-weight:800;color:var(--pri-2);margin:0 0 .3rem}
.card h2{font-size:1.15rem;font-weight:800;color:var(--pri-2);margin:.4rem 0 .5rem}
.card.ok{border-top-color:var(--on);background:var(--on-soft);margin-top:1rem}
.card code{font-size:1.15rem;font-weight:700;background:var(--white);padding:.15rem .5rem;border:1px solid var(--line)}
.fld{display:grid;gap:.3rem;margin-block:.8rem;border:0;padding:0}
.fld label,.fld legend{font-weight:700;font-size:.92rem;padding:0}
.fld input,.fld select{min-height:44px;border:1px solid var(--line);border-radius:2px;padding:0 .7rem;font:inherit;background:var(--white);width:100%}
.fld input[dir=ltr]{text-align:left}
.fld input:focus,.fld select:focus,input.num:focus{outline:2px solid #8a6a1f;outline-offset:1px;border-color:var(--pri)}
.fld input[readonly]{background:var(--soft)}
.chk{display:flex;align-items:center;gap:.5rem;min-height:36px;cursor:pointer}
.chk input{width:1.1rem;height:1.1rem;accent-color:var(--pri)}
.btn.wide{width:100%;justify-content:center;margin-top:.4rem}
.forgot{margin-top:1.1rem;border-top:1px solid var(--hair);padding-top:.8rem}
.forgot summary{cursor:pointer;color:var(--pri);font-weight:700;min-height:32px}
.who{display:flex;align-items:center;gap:.7rem;font-size:.92rem;padding-inline-start:.6rem;border-inline-start:1px solid var(--line)}
.who a{color:var(--pri);font-weight:700;text-decoration:none;min-height:44px;display:inline-flex;align-items:center}
.who .linkish{min-height:44px}
.linkish{background:none;border:0;padding:.3rem 0;color:var(--pri);text-decoration:underline;cursor:pointer;font:inherit;min-height:32px}
.codes{columns:2;font-size:1.05rem;font-weight:700;padding-inline-start:1.6rem}
.roles{margin:0;padding-inline-start:1.2rem;line-height:1.9}

.t-wrap{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:.92rem}
table.t th{font-size:.8rem;font-weight:400;color:var(--faint);text-align:right;padding:.45rem .5rem;border-bottom:1px solid var(--line);white-space:nowrap}
table.t td{padding:.55rem .5rem;border-bottom:1px solid var(--hair);text-align:right;vertical-align:top}
table.t td.n,table.t th.n{text-align:left;font-variant-numeric:tabular-nums}
table.t tr:last-child td{border-bottom:0}
table.t tfoot td{border-top:1px solid var(--line);font-weight:700}
.reason{font-size:.84rem;color:var(--muted);display:block}

footer{background:var(--pri-2);color:#e3ebe7;font-size:.84rem;border-top:2px solid var(--brass)}
footer .wrap{display:flex;justify-content:space-between;gap:1rem;padding-block:.65rem;flex-wrap:wrap}
.tip{position:fixed;z-index:50;background:#10201d;color:#fff;font-size:13px;line-height:1.45;border-radius:2px;padding:6px 10px;pointer-events:none;max-width:280px;white-space:pre-line}
.err{margin:30px;padding:16px;background:var(--bad-soft);color:var(--bad)}
.print-only,.m-only{display:none}

@media (max-width:1180px){
  .cols{grid-template-columns:minmax(0,1fr);gap:1.6rem}
  .tools{margin-inline-start:0;width:100%;padding-bottom:.6rem}
  .mast .wrap{gap:.4rem 1.4rem}
}
@media (max-width:760px){
  html{font-size:16px}
  .nav{width:100%;border-top:1px solid var(--hair);flex-wrap:wrap}
  .nav a{padding:0 .5rem;font-size:.9rem;white-space:nowrap}
  .tools select{flex:1 1 100%;min-width:0;font-size:.95rem}
  .head h1{font-size:1.6rem}
  .figs .wrap{grid-template-columns:repeat(2,minmax(0,1fr));padding-inline:16px}
  .fig{padding:.7rem .9rem}.fig:nth-child(odd){border-inline-start:0;padding-inline-start:0}
  .fig:nth-child(n+3){border-top:1px solid var(--line)}
  .fig .v{font-size:2rem}
  .u-head{display:none}
  .u-grid,.u-grid.has-delta{grid-template-columns:minmax(0,1fr) auto auto;gap:.3rem .6rem;padding-block:.6rem}
  .u-name{grid-column:1;grid-row:1}.u-val{grid-column:2;grid-row:1}.u-grid .pill{grid-column:3;grid-row:1}
  .track{grid-column:1/-1;grid-row:2}.u-rec,.delta{grid-row:3;text-align:right}.u-rec{grid-column:1}.delta{grid-column:2/-1}
  .chev{display:none}.m-only{display:inline}
}
[hidden]{display:none!important}
@media (max-width:760px){
  #editForm .save-bar{position:sticky;bottom:0;z-index:5;background:var(--white);border-top:1px solid var(--line);margin-inline:calc(var(--pad) * -1);padding-inline:var(--pad)}
}
@media (max-width:640px){
  table.t.cards thead{display:none}
  table.t.cards,table.t.cards tbody{display:block}
  .t-wrap:has(table.cards){overflow:visible}
  table.t.cards tr{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.4rem .7rem;padding:.7rem 0;border-bottom:1px solid var(--line)}
  table.t.cards td{display:block;padding:0;border:0;text-align:right}
  table.t.cards tr>td:first-child{grid-column:1/-1;font-weight:700}
  table.t.cards td[colspan]{grid-column:1/-1}
  table.t.cards td[data-label]::before{content:attr(data-label);display:block;font-size:.78rem;color:var(--muted);font-weight:400}
  #editForm .t-wrap{overflow:visible}
  #editForm table.t thead{display:none}
  #editForm table.t,#editForm table.t tbody{display:block}
  #editForm table.t tr{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.55rem .7rem;padding:.8rem;margin-bottom:.7rem;border:1px solid var(--line);background:var(--white)}
  #editForm table.t tr.err-row{display:block;padding:0;border:0;margin-top:-.5rem}
  #editForm table.t td{display:block;padding:0;border:0}
  #editForm table.t tr>td:first-child{grid-column:1/-1;font-weight:700}
  #editForm table.t td[data-label]::before{content:attr(data-label);display:block;font-size:.8rem;color:var(--muted);margin-bottom:.15rem}
  #editForm input.num,#editForm .txt,#editForm .txt.wide,#editForm .txt.short{width:100%;min-width:0}
}
@media (min-height:950px) and (min-width:1400px){a.u-row{min-height:3.7rem}.row3{min-height:2.15rem}.block{margin-bottom:1.8rem}.head{padding-block:1.7rem 1.4rem}.fig{padding-block:1.2rem}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* Landscape A4 for meetings. */
@page{size:A4 landscape;margin:9mm}
@media print{
  html{font-size:11.5px}
  html,body{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .page{min-height:0}
  .lead{background:none;color:var(--ink)}.lead h1,.lead .fig .v{color:var(--pri-2)}
  .lead .lede,.lead .crumb,.lead .fig .k,.lead .fig .s,.lead .fig .v small{color:var(--muted)}.lead .lede b{color:var(--ink)}
  .lead .figs{background:var(--soft);border-block:1px solid var(--line)}.lead .fig{border-color:var(--line)}
  .strip,.nav,.tools,.tip,.chev,.no-print,footer{display:none!important}
  .wrap{max-width:none;padding-inline:0}
  .mast .wrap{min-height:0}.org img{height:3.2rem}
  .print-only{display:block;margin-inline-start:auto;text-align:left;font-size:.9rem;color:var(--muted)}
  .head{padding-block:.5rem}.head h1{font-size:1.6rem}
  .figs .wrap{padding-inline:.8rem}
  .cols{grid-template-columns:minmax(0,1.75fr) minmax(0,1fr);gap:1.6rem;padding-block:.6rem 0}
  .fill{animation:none}
  a.u-row{min-height:2.6rem}
  .u-grid{grid-template-columns:minmax(9rem,1.15fr) minmax(8rem,2fr) 4.2rem 4.2rem 8rem}
  .u-grid.has-delta{grid-template-columns:minmax(9rem,1.15fr) minmax(8rem,2fr) 4.2rem 4.2rem 3.6rem 8rem}
  .block{break-inside:avoid}
  table.t tr{break-inside:avoid}
}
</style>

      apiJson: function (req) {
        fetch(API, { method: 'POST', body: JSON.stringify(req), headers: { 'Content-Type': 'text/plain;charset=utf-8' }, credentials: 'omit', redirect: 'follow' })
          .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })

  window.google = { script: { run: runner(null, null) } };

<script>
// Pages: overview, units list, unit sub-sheet. Scores come from the server; this file only draws them.
// Change figures appear only when a real earlier period exists. The baseline never shows them.
var STATUS_LABEL = { on_track: 'ضمن المسار', at_risk: 'دون المسار', behind: 'يحتاج إلى تحسين', none: 'لم ترفع' };
var WORK_STATUS = { finished: 'منتهٍ', ongoing: 'جارٍ', not_started: 'لم يبدأ', stopped: 'متوقف' };
var ICONS = {
  on_track: '<path d="M20 6 9 17l-5-5"/>',
  at_risk: '<path d="M12 9v4m0 4h.01M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/>',
  behind: '<circle cx="12" cy="12" r="9"/><path d="m15 9-6 6m0-6 6 6"/>',
  none: '<circle cx="12" cy="12" r="9"/><path d="M8 12h8"/>',

  up: '<path d="M12 19V5m-6 6 6-6 6 6"/>',

  print: '<path d="M6 9V3h12v6M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><path d="M6 14h12v7H6z"/>'
};
var MIX = [
  { key: 'finished', label: 'منجز', color: 'var(--c-finished)' },
  { key: 'transferred', label: 'محوّل', color: 'var(--c-transferred)' },
  { key: 'stuck', label: 'عالق بانتظار المواطن', color: 'var(--c-stuck)' },
  { key: 'inProgress', label: 'قيد التنفيذ', color: 'var(--c-progress)' }
];
var state = { period: null, editing: false };

function esc(s) { return String(s === null || s === undefined ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function icon(n, size) { return '<svg width="' + (size || 14) + '" height="' + (size || 14) + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + ICONS[n] + '</svg>'; }
function pct(v) { return v === null || v === undefined ? '-' : v.toFixed(1) + '%'; }
function fmt(n) { return Number(n || 0).toLocaleString('en-US'); }
function pill(st) { return '<span class="pill s-' + st + '">' + icon(st) + esc(STATUS_LABEL[st]) + '</span>'; }
// A work's single money figure ("financial value"): the amount entered, or an older estimate when that is all there is.
function workValue(w) { var h = function (v) { return v !== '' && v !== null && v !== undefined; }; return h(w.spent) ? Number(w.spent) : h(w.estimatedCost) ? Number(w.estimatedCost) : null; }
// Money per currency, rounded to whole units (never added across currencies).
function moneyLines(spent) {
  var keys = Object.keys(spent || {});
  return keys.length ? keys.map(function (c) { return '<span class="ltr">' + fmt(Math.round(spent[c])) + '</span> ' + esc(c); }).join(' · ') : '-';
}

var TOKEN_KEY = 'kpi-token';
function getToken() { try { return localStorage.getItem(TOKEN_KEY) || ''; } catch (e) { return state.token || ''; } }
function setToken(t) { state.token = t; try { if (t) localStorage.setItem(TOKEN_KEY, t); else localStorage.removeItem(TOKEN_KEY); } catch (e) { } }
// Every request carries the login token. An expired session sends the visitor back to the login screen.
function api(action, payload, ok, fail) {
  var rid = Date.now().toString(36) + Math.random().toString(36).slice(2);
  google.script.run
    .withSuccessHandler(function (txt) {
      var r = null;
      try { r = typeof txt === 'string' ? JSON.parse(txt) : txt; } catch (x) { }
      if (r && r.ok) return ok(r.data);
      if (r && r.auth) { var had = getToken(); setToken(''); return renderLogin(had ? r.error : ''); }
      if (r && r.mustChange) return api('me', {}, renderAccount, showError);
      fail(r && r.error || 'تعذر تحميل البيانات');
    })
    .withFailureHandler(function (e) { fail((e && e.message || 'تعذر الاتصال بالخادم') + (e && e.name ? ' [' + e.name + ']' : '')); })
    .apiJson({ action: action, payload: payload || {}, token: getToken(), requestId: rid });
}
function showError(msg) { document.getElementById('app').innerHTML = '<div class="err" role="alert">' + esc(msg) + '</div>'; }

function shell(d, active, body) {

    '<header class="mast"><div class="wrap">' +
      '<a class="org" href="#"><img src="' + PM_LOGO + '" alt="شعار بلدية نابلس"><div><b>بلدية نابلس</b><span>منصة مؤشرات الأداء</span></div></a>' +
      '<nav class="nav" aria-label="القائمة الرئيسية"><a href="#" class="' + (active === 'overview' ? 'on' : '') + '">النظرة العامة</a><a href="#units" class="' + (active === 'units' ? 'on' : '') + '">الأقسام والشعب</a>' +
        (d.user && d.user.role === 'admin' ? '<a href="#periods" class="no-print ' + (active === 'periods' ? 'on' : '') + '">الفترات</a><a href="#users" class="no-print ' + (active === 'users' ? 'on' : '') + '">المستخدمون</a>' : '') + '</nav>' +
      '<div class="tools">' + (d.periods ? '<label for="period" class="note">الفترة</label><select id="period">' + options + '</select>' +
        '<button class="btn" id="printBtn">' + icon('print', 17) + 'تصدير PDF</button>' : '') +
        (d.user ? '<span class="who no-print"><a href="#account" title="حسابي">' + esc(d.user.name) + '</a><button class="linkish" id="logoutBtn" type="button">خروج</button></span>' : '') + '</div>' +
      (d.period ? '<div class="print-only"><div>الفترة: ' + esc(d.period.label) + '</div><div>تاريخ الإصدار: <span class="ltr">' + esc(d.today) + '</span></div>' + (d.notice ? '<div>' + esc(d.notice) + '</div>' : '') + '</div>' : '') +
    '</div></header><main>' + body + '</main>' +
    '<footer><div class="wrap"><span>بلدية نابلس · الدائرة الهندسية</span>' + (d.today ? '<span>آخر تحديث للصفحة: <span class="ltr">' + esc(d.today) + '</span></span>' : '') + '</div></footer></div>';
}

function wire() {
  var per = document.getElementById('period');
  if (per) per.onchange = function (e) { state.period = e.target.value; route(); };
  var pr = document.getElementById('printBtn');
  if (pr) pr.onclick = function () { window.print(); };
  var lo = document.getElementById('logoutBtn');
  if (lo) lo.onclick = function () { api('auth.logout', {}, function () { setToken(''); renderLogin(); }, function () { setToken(''); renderLogin(); }); };
  window.scrollTo(0, 0);
}

function fig(k, v, s) { return '<div class="fig"><div class="k">' + k + '</div><div class="v">' + v + '</div><div class="s">' + (s || '') + '</div></div>'; }

  var missing = u.score === null;
  var color = { on_track: 'var(--on)', at_risk: 'var(--risk-fill)', behind: 'var(--bad)' }[u.status];
  var zones = 'background:linear-gradient(to left,var(--bad-zone) 0 ' + s.at + '%,var(--risk-zone) ' + s.at + '% ' + s.on + '%,var(--on-zone) ' + s.on + '% 100%)';
  var tip = 'منجز ' + fmt(u.totals.finished) + ' · محوّل ' + fmt(u.totals.transferred) + '\nعالق ' + fmt(u.totals.stuck) + ' · قيد التنفيذ ' + fmt(u.totals.inProgress);
  var bar = missing ? '<div class="track empty"></div>' :
    '<div class="track" style="' + zones + '" data-tip="' + esc(tip) + '"><div class="fill" style="width:' + u.score.toFixed(1) + '%;background:' + color + '"></div>' +
    '<i class="tick" style="right:' + s.at + '%"></i><i class="tick" style="right:' + s.on + '%"></i></div>';
  var sub = esc(u.label) + (u.reporting === 'partial' ? ' · ' + u.reportedCount + ' من ' + u.dueCount + ' مؤشرات' : '');
  var deltaCell = '';
  if (hasDelta) {
    var dv = !missing && u.previousScore !== null ? u.score - u.previousScore : null;
    deltaCell = dv === null ? '<span class="delta">-</span>' :
      '<span class="delta tn ' + (dv >= 0.05 ? 'up' : dv <= -0.05 ? 'down' : '') + '">' + (Math.abs(dv) >= 0.05 ? icon(dv > 0 ? 'up' : 'down', 12) : '') + '<span class="ltr">' + Math.abs(dv).toFixed(1) + '</span></span>';
  }
  return '<a class="u-grid u-row' + (hasDelta ? ' has-delta' : '') + '" href="#unit/' + encodeURIComponent(u.id) + '"><div class="u-name">' + esc(u.name) + '<small>' + sub + '</small></div>' + bar +
    '<div class="u-val ltr tn">' + (missing ? '-' : pct(u.score)) + '</div><div class="u-rec tn"><span class="m-only">الوارد </span>' + (missing ? '-' : fmt(u.totals.received)) + '</div>' + deltaCell + pill(missing ? 'none' : u.status) + '<span class="chev">' + icon('chev', 15) + '</span></a>';
}

// Explains every status and colour in words, on screen and in the PDF.
function keyHtml(s) {
  return '<div class="key" aria-label="مفتاح الحالات">' +
    '<span>' + pill('on_track') + 'النتيجة ' + s.on + '% فأكثر</span>' +
    '<span>' + pill('at_risk') + 'من ' + s.at + '% إلى أقل من ' + s.on + '%</span>' +
    '<span>' + pill('behind') + 'أقل من ' + s.at + '%</span>' +
    '<span>' + pill('none') + 'لم تُدخل بيانات هذه الفترة</span></div>' +
    '<div class="formula"><b>النتيجة</b> = (منجز + محوّل + عالق) ÷ (الوارد − الملغى). <b>عالق</b>: أنجز القسم أو الشعبة الدور المطلوب وبانتظار المواطن.</div>';
}

function unitsBlock(d) {
  var s = { on: Number(d.settings.onTrackMin), at: Number(d.settings.atRiskMin) };
  var hasDelta = d.previousScore !== null;
  return '<section class="block"><div class="sec-head"><h2>أداء الأقسام والشعب</h2></div>' +
    '<div class="u-grid u-head' + (hasDelta ? ' has-delta' : '') + '"><span>القسم أو الشعبة</span><span class="scale" aria-hidden="true"><i style="right:0">0</i><i style="right:' + s.at + '%">' + s.at + '</i><i style="right:' + s.on + '%">' + s.on + '</i><i style="right:100%">100%</i></span><span style="text-align:left">النتيجة</span><span style="text-align:left">الوارد</span>' + (hasDelta ? '<span>التغير</span>' : '') + '<span>الحالة</span></div>' +
    d.ranked.map(function (u) { return unitRow(u, s, hasDelta); }).join('') + keyHtml(s) + '</section>';
}

function mixBlock(t) {
  var net = MIX.reduce(function (s, m) { return s + t[m.key]; }, 0);
  var segs = MIX.map(function (m) { return t[m.key] ? '<div style="flex:' + t[m.key] + ' 1 0;background:' + m.color + '" data-tip="' + esc(m.label + ': ' + fmt(t[m.key])) + '"></div>' : ''; }).join('');
  var rows = MIX.map(function (m) { return '<div class="row3"><span><i class="dot" style="background:' + m.color + '"></i>' + m.label + '</span><b class="tn">' + fmt(t[m.key]) + '</b><span class="tn">' + (net ? (t[m.key] / net * 100).toFixed(0) : 0) + '%</span></div>'; }).join('');
  return '<section class="block"><div class="sec-head"><h2>حالة المعاملات</h2>' + (t.cancelled ? '<span class="note">ملغى ' + fmt(t.cancelled) + '</span>' : '') + '</div><div class="seg">' + segs + '</div>' + rows + '</section>';
}

// The department's main justification for unfinished transactions (one text, set by the admin).
function justificationBox(text, unfinished) {
  if (!text) return '';
  var lines = String(text).split(/\n/), html = '', list = [];
  var flush = function () { if (list.length) { html += '<ul>' + list.map(function (l) { return '<li>' + esc(l) + '</li>'; }).join('') + '</ul>'; list = []; } };
  lines.forEach(function (l) { l = l.trim(); if (!l) return; if (/^[-•]/.test(l)) list.push(l.replace(/^[-•]\s*/, '')); else { flush(); html += '<p>' + esc(l) + '</p>'; } });
  flush();
  return '<section class="block just-box"><div class="sec-head"><h2>المبرر الرئيسي لعدم الإنجاز</h2>' + (unfinished ? '<span class="note">' + fmt(unfinished) + ' معاملة غير منجزة</span>' : '') + '</div>' + html + '</section>';
}
// Reasons grouped by who can act on them. Percentages are of all unfinished items.
// opts.management: show the "what management can support" box (home page); opts.notes: section notes.
function reasonsPanel(b, opts) {
  opts = opts || {};
  if (!b || !b.unfinished) return '<section class="block"><div class="sec-head"><h2>أسباب المعاملات غير المنجزة</h2></div><div class="note">لا توجد معاملات غير منجزة في هذه الفترة</div></section>';
  var pctOf = function (n) { return (n / Math.max(b.unfinished, b.explained) * 100).toFixed(0); };
  var rows = b.groups.map(function (g) {
    var same = g.items.length === 1 && (g.key === 'normal' || g.key === 'internal' || g.items[0].name === g.label);
    var top = same ? '' : g.items.slice(0, opts.top || 3).map(function (it) { return esc(it.name) + ' <span class="tn">' + fmt(it.count) + '</span>'; }).join(' · ');
    return '<div class="rg rg-' + g.key + '"><div class="rg-head"><span class="rg-name">' + esc(g.label) + '</span><b class="tn">' + fmt(g.count) + '</b><span class="tn rg-pct">' + pctOf(g.count) + '%</span></div>' +
      '<div class="rg-bar" aria-hidden="true"><i style="width:' + pctOf(g.count) + '%"></i></div>' + (top ? '<div class="rg-items">' + top + '</div>' : '') + '</div>';
  }).join('') + (b.notGiven ? '<div class="rg rg-none"><div class="rg-head"><span class="rg-name">قيد المتابعة لدى الأقسام والشعب</span><b class="tn">' + fmt(b.notGiven) + '</b><span class="tn rg-pct">' + pctOf(b.notGiven) + '%</span></div><div class="rg-bar" aria-hidden="true"><i style="width:' + pctOf(b.notGiven) + '%"></i></div></div>' : '');
  var mg = '';
  if (opts.management && b.management.length) {
    mg = '<div class="mg-box"><h3>ما يمكن للإدارة دعمه</h3><ul>' + b.management.slice(0, 6).map(function (x) {
      return '<li><b>' + esc(x.unit) + '</b>: ' + esc(x.name) + ' (<span class="tn">' + fmt(x.count) + '</span> معاملة)' + (x.note ? '<span class="mg-note">' + esc(x.note) + '</span>' : '') + '</li>';
    }).join('') + '</ul></div>';
  }
  var notes = opts.notes && opts.notes.length ? '<div class="reason-notes">' + opts.notes.map(function (n) { return '<p><b>' + esc(n.name) + ':</b> ' + esc(n.note) + '</p>'; }).join('') + '</div>' : '';
  return '<section class="block"><div class="sec-head"><h2>أسباب المعاملات غير المنجزة</h2><span class="note">' + fmt(b.unfinished) + ' معاملة غير منجزة</span></div>' + rows + mg + notes + '</section>';
}
// Percentages are of all unfinished items, so explained reasons are never inflated; the rest shows as "not classified yet".
function reasonsBlock(list, limit, notes, unfinished) {
  var total = list.reduce(function (s, r) { return s + r.count; }, 0);
  var base = Math.max(total, unfinished || 0);
  var shown = list.slice(0, limit), rest = list.slice(limit).reduce(function (s, r) { return s + r.count; }, 0);
  var line = function (name, count, cls) { return '<div class="row3' + (cls ? ' ' + cls : '') + '"><span>' + name + '</span><b class="tn">' + fmt(count) + '</b><span class="tn">' + (base ? (count / base * 100).toFixed(0) : 0) + '%</span></div>'; };
  var rows = shown.map(function (r) { return line(esc(r.name), r.count); }).join('') + (rest ? line('أسباب أخرى', rest) : '') +
    (unfinished > total ? line('قيد المتابعة لدى الأقسام والشعب', unfinished - total, 'unclassified') : '');
  var head = unfinished ? 'حُدد السبب لـ ' + fmt(total) + ' من ' + fmt(unfinished) + ' معاملة غير منتهية' : 'الإجمالي ' + fmt(total);
  return '<section class="block"><div class="sec-head"><h2>أسباب عدم الإنجاز</h2><span class="note">' + head + '</span></div>' + (rows || '<div class="note">لا توجد أسباب مسجلة لهذه الفترة</div>') +
    (notes && notes.length ? '<div class="reason-notes">' + notes.map(function (n) { return '<p><b>' + esc(n.name) + ':</b> ' + esc(n.note) + '</p>'; }).join('') + '</div>' : '') + '</section>';
}

function worksBlock(t) {
  var open = t.ongoing + t.stopped + t.notStarted;
  var money = function (label, m, key) { return Object.keys(m || {}).length ? '<a class="row3 money" href="#works/' + key + '"><span>' + label + '</span><b class="tn">' + moneyLines(m) + '</b><span class="chev">' + icon('chev', 14) + '</span></a>' : ''; };
  return '<section class="block"><div class="sec-head"><h2>الأعمال الميدانية</h2><span class="note">كما أفادت الأقسام والشعب</span></div><div class="work-sum two">' +
    '<a href="#works/done" class="wlink"><div class="v tn">' + fmt(t.finished) + '</div><div class="k">أعمال منتهية</div></a><a href="#works/open" class="wlink"><div class="v tn">' + fmt(open) + '</div><div class="k">أعمال غير منتهية</div></a></div>' +
    '<h3 class="money-h">القيمة المالية</h3>' + money('للأعمال المنتهية', t.valueDone, 'done') + money('للأعمال غير المنتهية', t.valueOpen, 'open') +
    (Object.keys(t.spent || {}).length > 1 ? '<p class="note">كل عملة محسوبة وحدها، دون تحويل بين العملات.</p>' : '') + '</section>';
}

// A shortcut for section heads and division editors: straight to their edit screen for the open month.
function tasksBox(d) {
  if (!d.myTasks || !d.myTasks.length) return '';
  return '<div class="wrap no-print"><section class="task-box" aria-label="مطلوب منك">' + d.myTasks.map(function (t, i) {
    return '<div class="task"><div><b>أدخل أرقام ' + esc(t.periodLabel) + ' - ' + esc(t.unitName) + '</b><span class="note">' + (t.done ? 'أُدخلت أرقام ' + t.done + ' من ' + t.due + ' مؤشرات' : 'لم تُدخل أي أرقام بعد') + '</span></div>' +
      '<button class="btn" type="button" data-task="' + i + '">إدخال الأرقام</button></div>';
  }).join('') + '</section></div>';
}
function wireTasks(d) {
  document.querySelectorAll('[data-task]').forEach(function (b) {
    b.onclick = function () { var t = d.myTasks[+b.dataset.task]; state.period = t.periodId; state.editing = true; location.hash = '#unit/' + encodeURIComponent(t.unitId); };
  });
}
function renderOverview(d) {
  var n = { on_track: 0, at_risk: 0, behind: 0, none: 0 };
  d.ranked.forEach(function (u) { if (u.reporting !== 'not_due') n[u.score === null ? 'none' : u.status]++; });
  var behind = d.ranked.filter(function (u) { return u.score !== null && u.status === 'behind'; }).map(function (u) { return esc(u.name); });
  var missing = d.ranked.filter(function (u) { return u.reporting === 'missing'; }).map(function (u) { return esc(u.name); });
  var lede = [];
  if (behind.length) lede.push(STATUS_LABEL.behind + ': <b>' + behind.join('، ') + '</b>');
  if (missing.length) lede.push('لم ترفع البيانات: <b>' + missing.join('، ') + '</b>');
  var compare = d.previousScore !== null && d.score !== null
    ? (d.score - d.previousScore >= 0 ? 'ارتفاع ' : 'انخفاض ') + '<span class="ltr">' + Math.abs(d.score - d.previousScore).toFixed(1) + '</span> نقطة مقارنة بـ' + esc(d.previousLabel)
    : d.previousLabel ? 'تظهر المقارنة مع ' + esc(d.previousLabel) + ' بعد إدخال أرقام هذه الفترة'
    : 'تبدأ المقارنة بعد رفع بيانات ' + esc(d.nextLabel);
  var body = '<div class="lead"><div class="wrap head"><h1>مؤشرات أداء الدائرة الهندسية</h1><p class="lede period-line">' + esc(d.period.label) + (d.period.closed ? ' · فترة مغلقة' : '') + '</p><p class="lede">' + (lede.join(' · ') || 'جميع الأقسام والشعب رفعت بياناتها ولا يوجد منها ما يحتاج إلى تحسين') + '</p></div>' +
    '<div class="figs"><div class="wrap">' +
      fig('أداء الدائرة', '<span class="ltr">' + pct(d.score) + '</span>', pill(d.status === 'none' ? 'none' : d.status)) +
      fig('أقسام وشعب ضمن المسار', n.on_track + ' <small>من ' + d.coverage.total + '</small>', STATUS_LABEL.at_risk + ' ' + n.at_risk + ' · ' + STATUS_LABEL.behind + ' ' + n.behind) +
      fig('أقسام وشعب رفعت البيانات', d.coverage.reported + ' <small>من ' + d.coverage.total + '</small>', d.coverage.partial ? d.coverage.partial + ' بشكل جزئي' : '') +
      fig('المعاملات الواردة', fmt(d.totals.received), compare) +
    '</div></div></div>' +
    tasksBox(d) + '<div class="wrap cols"><div>' + unitsBlock(d) + '</div><div>' + mixBlock(d.totals) + justificationBox(d.settings.mainJustification, d.totals.stuck + d.totals.inProgress) + worksBlock(d.fieldTotals) + '</div></div>';
  document.getElementById('app').innerHTML = shell(d, 'overview', body);
  wire();
  wireTasks(d);
}

function renderUnits(d) {
  var body = '<div class="lead"><div class="wrap head"><div class="crumb"><a href="#">النظرة العامة</a> / الأقسام والشعب</div><h1>الأقسام والشعب</h1><p class="lede">اختر قسماً أو شعبة لعرض تفاصيلها.</p></div></div>' +
    '<div class="wrap narrow-block">' + unitsBlock(d) +
    (d.user && d.user.role === 'admin' ? '<section class="block no-print"><details class="add-unit"><summary class="btn ghost">+ إضافة قسم أو شعبة</summary><form id="unitForm" class="card" novalidate>' +
      field('nuName', 'الاسم', 'text', 'maxlength="200"') +
      '<div class="fld"><label for="nuLabel">النوع</label><select id="nuLabel"><option value="قسم">قسم</option><option value="شعبة">شعبة</option></select></div>' +
      '<p class="note">بعد الإضافة افتح القسم أو الشعبة واضغط "تعديل البيانات" لإضافة مؤشراته.</p>' +
      '<div class="ferr" id="nuMsg" role="alert"></div><div class="form-actions"><button class="btn" id="nuBtn" type="submit">إضافة</button></div></form></details></section>' : '') + '</div>';
  document.getElementById('app').innerHTML = shell(d, 'units', body);
  wire();
  var uf = document.getElementById('unitForm');
  if (uf) uf.onsubmit = function (ev) {
    ev.preventDefault();
    var b = document.getElementById('nuBtn'), m = document.getElementById('nuMsg'); busy(b, true); m.textContent = '';
    api('admin.addUnit', { name: val('nuName'), label: val('nuLabel') }, function (r) { state.editing = true; location.hash = '#unit/' + r.id; }, function (e) { busy(b, false); m.textContent = e; });
  };
}

function kpiTable(kpis) {
  var rows = kpis.map(function (r) {
    var e = r.entry;
    if (!e) return '<tr><td>' + esc(r.name) + '</td><td colspan="6" class="note">لم ترفع البيانات لهذا المؤشر</td><td>' + pill('none') + '</td></tr>';
    return '<tr><td>' + esc(r.name) + '</td><td class="n" data-label="الوارد">' + fmt(e.received) + '</td><td class="n" data-label="منجز">' + fmt(e.finished) + '</td><td class="n" data-label="محوّل">' + fmt(e.transferred) + '</td><td class="n" data-label="عالق">' + fmt(e.stuck) + '</td><td class="n" data-label="قيد التنفيذ">' + fmt(e.inProgress) + '</td><td class="n" data-label="النتيجة"><b>' + pct(r.score) + '</b></td><td data-label="الحالة">' + pill(r.status) + '</td></tr>';
  }).join('');
  return '<div class="t-wrap"><table class="t cards"><thead><tr><th>المؤشر</th><th class="n">الوارد</th><th class="n">منجز</th><th class="n">محوّل</th><th class="n">عالق</th><th class="n">قيد التنفيذ</th><th class="n">النتيجة</th><th>الحالة</th></tr></thead><tbody>' + rows + '</tbody></table></div>';
}

function worksTable(works) {
  if (!works.length) return '<div class="note" style="padding-top:.5rem">لا توجد أعمال مسجلة لهذه الفترة</div>';
  var rows = works.map(function (w) {
    return '<tr><td>' + esc(w.title) + (w.fromPeriod ? '<span class="reason">من ' + esc(w.fromPeriod) + '</span>' : '') + (w.reason ? '<span class="reason">السبب: ' + esc(w.reason) + '</span>' : '') + '</td><td data-label="النوع">' + esc(w.type) + '</td><td data-label="الموقع">' + esc(w.location || '-') + '</td><td data-label="الحالة">' + esc(WORK_STATUS[w.status] || '-') + '</td><td class="n" data-label="البدء">' + esc(w.startDate || '-') + '</td><td class="n" data-label="الانتهاء">' + esc(w.endDate || '-') + '</td><td class="n" data-label="القيمة المالية">' + (workValue(w) === null ? '-' : fmt(Math.round(workValue(w)))) + '</td><td data-label="العملة">' + (workValue(w) === null ? '-' : esc(w.currency)) + '</td></tr>';
  }).join('');
  return '<div class="t-wrap"><table class="t cards"><thead><tr><th>العمل</th><th>النوع</th><th>الموقع</th><th>الحالة</th><th class="n">البدء</th><th class="n">الانتهاء</th><th class="n">القيمة المالية</th><th>العملة</th></tr></thead><tbody>' + rows + '</tbody></table></div>';
}

function tasksTable(tasks) {
  if (!tasks.length) return '<div class="note" style="padding-top:.5rem">لا توجد مهام مسجلة</div>';
  var rows = tasks.map(function (t) {
    return '<tr><td>' + esc(t.title) + (t.status !== 'done' && t.reason ? '<span class="reason">سبب عدم الإنجاز: ' + esc(t.reason) + '</span>' : '') + '</td><td>' + esc(t.owner) + '</td><td class="n">' + esc(t.dueDate) + '</td><td class="n">' + fmt(t.percentDone) + '%</td><td>' + (t.status === 'done' ? 'منجزة' : 'غير منتهية') + '</td></tr>';
  }).join('');
  return '<div class="t-wrap"><table class="t"><thead><tr><th>المهمة</th><th>المسؤول</th><th class="n">الموعد</th><th class="n">الإنجاز</th><th>الحالة</th></tr></thead><tbody>' + rows + '</tbody></table></div>';
}

function historyTable(h) {
  var rows = h.map(function (x) { return '<tr><td>' + esc(x.label) + '</td><td class="n" data-label="الوارد">' + (x.score === null ? '-' : fmt(x.received)) + '</td><td class="n" data-label="النتيجة"><b>' + pct(x.score) + '</b></td><td data-label="الحالة">' + pill(x.score === null ? 'none' : x.status) + '</td></tr>'; }).join('');
  return '<div class="t-wrap"><table class="t cards"><thead><tr><th>الفترة</th><th class="n">الوارد</th><th class="n">النتيجة</th><th>الحالة</th></tr></thead><tbody>' + rows + '</tbody></table></div>';
}

function renderUnit(d) {
  var u = d.unit, t = u.totals, missing = u.score === null, wt = { finished: 0, spent: {} };
  d.works.forEach(function (w) { if (w.status === 'finished') wt.finished++; if (workValue(w) !== null && w.currency) wt.spent[w.currency] = (wt.spent[w.currency] || 0) + workValue(w); });
  var body = '<div class="lead"><div class="wrap head"><div class="crumb"><a href="#">النظرة العامة</a> / <a href="#units">الأقسام والشعب</a> / ' + esc(u.name) + '</div>' +
      '<div style="display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap;align-items:flex-end"><div><h1>' + esc(u.name) + '</h1><p class="lede">' + esc(d.period.label) + (d.period.closed ? ' · <b>فترة مغلقة</b>' : '') + (d.lastEdit && !missing ? ' · آخر تحديث: ' + esc(d.lastEdit) : '') + '</p></div>' +
      (d.canEdit && !state.editing ? '<button class="btn ghost no-print" id="editBtn">تعديل البيانات</button>' : '') + '</div></div>' +
    '<div class="figs"><div class="wrap">' +
      fig('النتيجة', '<span class="ltr">' + pct(u.score) + '</span>', pill(missing ? 'none' : u.status)) +
      fig('الوارد', fmt(t.received), t.cancelled ? 'ملغى ' + fmt(t.cancelled) : '') +
      fig('منجز ومحوّل', fmt(t.finished + t.transferred), 'منجز ' + fmt(t.finished) + ' · محوّل ' + fmt(t.transferred)) +

        var row = form.querySelector('[data-err="' + e.id + '"]');
        if (row) { row.hidden = false; row.firstChild.textContent = e.message; }
      });
      msg.textContent = 'لم تُحفظ التعديلات. يرجى تصحيح الأخطاء المبينة باللون الأحمر.';
      var first = form.querySelector('.err-row:not([hidden])');
      if (first) { var st = first.closest('.step'); if (st && st.hidden) goStep(Number(st.dataset.step)); }
      if (first) { first.scrollIntoView({ block: 'center' }); var prev = first.previousElementSibling, inp = prev && prev.querySelector('input,select'); if (inp) inp.focus({ preventScroll: true }); }
    }, function (m) { btn.disabled = false; fail(m); });
  };
  if (!d.localCopy) return;
  document.getElementById('copyBtn').onclick = function () {
    api('exportFigures', {}, function (r) {
      var a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([r.json], { type: 'application/json' }));
      a.download = 'kpi-figures-' + d.today + '.json';
      a.click();
      URL.revokeObjectURL(a.href);
    }, fail);
  };
  var file = document.getElementById('loadFile');
  document.getElementById('loadBtn').onclick = function () { file.click(); };
  file.onchange = function () {
    if (!file.files[0]) return;
    file.files[0].text().then(function (text) { api('importFigures', { json: text }, done, fail); });
  };
  document.getElementById('resetBtn').onclick = function () {
    if (window.confirm('ستُحذف جميع التعديلات وتعود الأرقام كما في ملفات الأقسام والشعب. هل تريد المتابعة؟')) api('resetFigures', {}, done, fail);
  };
}

// Field works across all sections: distribution of the money by section and by type, then the full list.
function renderWorks(d) {
  var done = d.status === 'done', title = done ? 'الأعمال المنتهية' : 'الأعمال غير المنتهية';
  var cur = {}, bySec = {}, byType = {};
  d.works.forEach(function (w) {
    var c = w.currency || '';
    if (w.value !== null && c) cur[c] = (cur[c] || 0) + w.value;
    var s = bySec[w.unit] = bySec[w.unit] || { n: 0, v: {} }; s.n++;
    var t = byType[w.type || 'غير محدد'] = byType[w.type || 'غير محدد'] || { n: 0, v: {} }; t.n++;
    if (w.value !== null && c) { s.v[c] = (s.v[c] || 0) + w.value; t.v[c] = (t.v[c] || 0) + w.value; }
  });
  var main = Object.keys(cur).sort(function (a, b) { return cur[b] - cur[a]; })[0];
  var dist = function (heading, map) {
    // Only sections with a recorded value; value and share only (no counts).
    var keys = Object.keys(map).filter(function (k) { return Object.keys(map[k].v).length; }).sort(function (a, b) { return (map[b].v[main] || 0) - (map[a].v[main] || 0); });
    if (!keys.length) return '';
    return '<section class="block"><div class="sec-head"><h2>' + heading + '</h2></div>' + keys.map(function (k) {
      var x = map[k], share = main && cur[main] ? (x.v[main] || 0) / cur[main] * 100 : 0;
      return '<div class="dist"><div class="dist-head"><span class="dist-name">' + esc(k) + '</span><b class="tn">' + moneyLines(x.v) + '</b><span class="tn dist-pct">' + (main ? share.toFixed(0) + '%' : '') + '</span></div>' +
        '<div class="rg-bar" aria-hidden="true"><i style="width:' + share.toFixed(1) + '%"></i></div></div>';
    }).join('') + '</section>';
  };
  var rows = d.works.slice().sort(function (a, b) { return (b.value || 0) - (a.value || 0); }).map(function (w) {
    return '<tr><td>' + esc(w.title) + '</td><td data-label="القسم أو الشعبة"><a href="#unit/' + encodeURIComponent(w.unitId) + '">' + esc(w.unit) + '</a></td><td data-label="النوع">' + esc(w.type || '-') + '</td>' +
      (done ? '' : '<td data-label="الحالة">' + esc(WORK_STATUS[w.status] || 'غير محددة') + '</td>') +
      '<td class="n" data-label="القيمة المالية">' + (w.value === null ? '-' : fmt(Math.round(w.value))) + '</td><td data-label="العملة">' + (w.value === null ? '-' : esc(w.currency)) + '</td></tr>';
  }).join('');
  var body = '<div class="lead"><div class="wrap head"><div class="crumb"><a href="#">النظرة العامة</a> / ' + title + '</div><h1>' + title + '</h1><p class="lede">' + esc(d.period.label) + ' · كما أفادت الأقسام والشعب</p></div>' +
    '<div class="figs"><div class="wrap">' + fig('عدد الأعمال', fmt(d.works.length), '') + fig('القيمة المالية', '<span style="font-size:.75em">' + moneyLines(cur) + '</span>', Object.keys(cur).length > 1 ? 'كل عملة وحدها' : '') +
    fig('الأقسام والشعب', Object.keys(bySec).length, '') + '<div class="fig"><div class="k">عرض</div><div class="v" style="font-size:1rem"><a class="btn ghost" href="#works/' + (done ? 'open' : 'done') + '">' + (done ? 'الأعمال غير المنتهية' : 'الأعمال المنتهية') + '</a></div></div></div></div></div>' +
    '<div class="wrap cols"><div><section class="block"><div class="sec-head"><h2>قائمة الأعمال</h2><span class="note">مرتبة من الأعلى قيمة</span></div>' +
      (rows ? '<div class="t-wrap"><table class="t cards"><thead><tr><th>العمل</th><th>القسم أو الشعبة</th><th>النوع</th>' + (done ? '' : '<th>الحالة</th>') + '<th class="n">القيمة المالية</th><th>العملة</th></tr></thead><tbody>' + rows + '</tbody></table></div>' : '<div class="note">لا توجد أعمال في هذه الفترة</div>') + '</section></div>' +
    '<div>' + dist('توزيع القيمة المالية حسب القسم أو الشعبة', bySec) + '</div></div>';
  document.getElementById('app').innerHTML = shell(d, 'overview', body);
  wire();
}

function route() {
  var h = location.hash.replace(/^#/, '');
  var m = /^unit\/(.+)$/.exec(h);
  if (!m) state.editing = false;
  if (h === 'account') return api('me', {}, renderAccount, showError);
  if (h === 'users') return api('admin.users', {}, renderUsers, showError);
  if (h === 'periods') return api('admin.periods', {}, renderPeriods, showError);
  var wm = /^works\/(done|open)$/.exec(h);
  if (wm) return api('works', { status: wm[1], period: state.period }, function (d) { state.period = d.period.id; renderWorks(d); }, showError);
  if (m) return api('unit', { id: decodeURIComponent(m[1]), period: state.period }, function (d) { state.period = d.period.id; renderUnit(d); }, showError);
  api('dashboard', { period: state.period }, function (d) { state.period = d.period.id; (h === 'units' ? renderUnits : renderOverview)(d); }, showError);
}

// Tooltips add detail on hover; every value is also visible on the page or the unit's sub-sheet.
(function () {
  var tip = document.getElementById('tip');
  document.addEventListener('mousemove', function (e) {
    var el = e.target.closest && e.target.closest('[data-tip]');
    if (!el) { tip.hidden = true; return; }
    tip.textContent = el.getAttribute('data-tip'); tip.hidden = false;
    var w = tip.offsetWidth, h = tip.offsetHeight;
    tip.style.left = Math.max(8, Math.min(innerWidth - w - 8, e.clientX - w / 2)) + 'px';
    tip.style.top = Math.max(8, e.clientY - h - 12) + 'px';
  });
})();

// Any unexpected error is shown on the page instead of leaving it on 'loading'.
window.addEventListener('error', function (e) { showError('خطأ في الصفحة: ' + (e.message || e.error || '')); });
window.addEventListener('unhandledrejection', function (e) { showError('خطأ في الصفحة: ' + (e.reason && e.reason.message || e.reason || '')); });
window.addEventListener('hashchange', route);
route();
</script>
